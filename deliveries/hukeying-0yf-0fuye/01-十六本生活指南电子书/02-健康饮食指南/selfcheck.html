<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健康饮食自查 · 24 题</title>
<style>
:root{
  --bg:#f7f5f1; --panel:#fffdf9; --ink:#1f1d1a; --muted:#6f6a62;
  --line:#ded8ce; --accent:#8a4b2f; --accent-soft:#f1e4da;
  --good:#2f6b4f; --warn:#9a5b17; --bad:#8f2f2f;
  --radius:14px; --shadow:0 10px 30px rgba(40,30,20,.07);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#171513;--panel:#211e1a;--ink:#ede7dd;--muted:#a59d91;--line:#37322c;--accent:#d79a76;--accent-soft:#33251d;--good:#86c3a3;--warn:#dfae6d;--bad:#e08f8f;--shadow:0 10px 30px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;line-height:1.7;font-size:16px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:10}
.top{display:flex;align-items:center;gap:14px;padding:12px 0;font-size:13.5px}
.top .brand{font-weight:700;font-size:16px;color:var(--ink)}
.top nav{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
.top nav a{color:var(--muted)}
.hero{padding:30px 0 8px}
.hero h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px);line-height:1.3}
.hero p{margin:0;color:var(--muted);max-width:760px}
.badge{display:inline-block;margin:12px 6px 0 0;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.safety{background:color-mix(in srgb,var(--bad) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 28%,var(--line));border-radius:12px;padding:14px 16px;margin:18px 0;font-size:14px}
.safety strong{color:var(--bad)}
.dim{margin:26px 0 8px}
.dim h2{font-size:17px;margin:0 0 2px;display:flex;align-items:baseline;gap:10px}
.dim h2 span{font-size:12px;color:var(--muted);font-weight:400}
.dim p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.q .text{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.q .num{color:var(--accent);font-size:12px;font-weight:700;min-width:26px;padding-top:3px}
.q .opts{display:flex;gap:8px;flex-wrap:wrap}
.q label{border:1px solid var(--line);border-radius:9px;padding:5px 12px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:6px}
.q label:hover{border-color:var(--accent)}
.q input{accent-color:var(--accent)}
.q.critical .num::after{content:"红线";display:block;font-size:9px;color:var(--bad);letter-spacing:.08em;font-weight:400}
.actions{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:center;margin-top:24px;z-index:5}
.actions .progress{color:var(--muted);font-size:13px}
.actions .spacer{flex:1}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{color:#fff;opacity:.92}
.result{margin:24px 0 40px;border-top:1px solid var(--line);padding-top:24px}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .big{font-size:26px;font-weight:700;line-height:1.2}
.card .lbl{font-size:12.5px;color:var(--muted)}
.bar{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent)}
.dimrow{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;font-size:13.5px;margin:8px 0}
.dimrow .track{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.dimrow .track i{display:block;height:100%;background:var(--accent)}
.dimrow .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.recs{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:18px 0}
.recs h3{margin:0 0 8px;font-size:16px}
.recs ul{margin:0;padding-left:20px}
.recs li{margin:6px 0;font-size:14px}
.recs .read{font-size:12.5px;color:var(--muted)}
.red{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--panel))}
.red h3{color:var(--bad)}
.hidden{display:none}
footer{border-top:1px solid var(--line);padding:22px 0 50px;color:var(--muted);font-size:12.5px}
@media (max-width:640px){.dimrow{grid-template-columns:110px 1fr 44px}.q .opts{gap:6px}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <span class="brand">健康饮食指南</span>
    <nav><a href="index.html">检索</a><a href="PATTERNS.md">对话模式</a><a href="SOURCES.md">来源</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <h1>24 题自查：你现在的位置</h1>
    <p id="intro"></p>
    <span class="badge">不评分你这个人</span>
    <span class="badge">只指向下一步</span>
    <span class="badge">三道红线题</span>
  </section>

  <div class="safety">
    <strong>先看风险。</strong>有确诊疾病、正在服药、孕期或术后，饮食方案以医生和注册营养师为准。不要自行停药或加药。出现持续腹痛、便血、不明原因体重下降、进食障碍信号，尽快就医；急救 <strong>120</strong>，心理援助 <strong>12356</strong>。
  </div>

  <form id="quiz"></form>

  <div class="actions">
    <span class="progress" id="progress">0 / 24 已答</span>
    <span class="spacer"></span>
    <button type="button" id="reset">重来</button>
    <button type="button" class="primary" id="submit">看结果</button>
  </div>

  <section class="result hidden" id="result" aria-live="polite"></section>
</main>
<footer>
  <div class="wrap">
    <p>这本书不替代心理治疗、医疗或法律意见。自查结果只反映你此刻的选择，不是诊断。</p>
    <p>内容 CC BY 4.0 · 代码 MIT · 对话示例为编写情境。</p>
  </div>
</footer>

<script>
const QUIZ = {
  "version": "1.0.0",
  "title": "健康饮食自查",
  "intro": "24 道是否题，六个维度。不是考试，是找下一步：哪些已经做到，哪些会在体检报告上体现出来。第 6、17、24 题是红线题，任何一题答「否」，都会先给出对应提醒。",
  "scale": {"yes": 2, "unsure": 1, "no": 0},
  "dimensions": [
    {"id": "goal", "name": "目标与基线", "desc": "知不知道自己想改什么，有没有一个起点数据。"},
    {"id": "amount", "name": "能量与结构", "desc": "吃多少、蛋白质够不够、餐盘比例对不对。"},
    {"id": "food", "name": "食材选择", "desc": "主食质量、蔬菜种类、油盐糖与加工食品。"},
    {"id": "outside", "name": "外食与社交", "desc": "食堂、外卖、聚餐、酒、出差。"},
    {"id": "risk", "name": "风险与边界", "desc": "什么情况必须就医，什么方法不能自己试。"},
    {"id": "habit", "name": "记录与坚持", "desc": "有没有记录、有没有默认规则、能不能长期做。"}
  ],
  "questions": [
    {"id": "q1", "dim": "goal", "text": "我能用一句话说出这三个月只改哪一件事。", "read": "1.1", "hint": "一次只改一件事，成功率更高。"},
    {"id": "q2", "dim": "goal", "text": "我有体重、腰围或体检报告的起点数据。", "read": "1.3", "hint": "同一时间、同一状态测量才有可比性。"},
    {"id": "q3", "dim": "goal", "text": "我知道自己的主目标是减脂、增肌还是控指标，而不是三个一起。", "read": "1.2", "hint": "目标不同，吃法不同。"},
    {"id": "q4", "dim": "goal", "text": "我看过体检报告里血糖、血脂、尿酸、肝功能四组关键项。", "read": "1.4", "hint": "连续两年异常的项目优先复查。"},
    {"id": "q5", "dim": "amount", "text": "我一天至少两餐有明确的蛋白质来源。", "read": "4.3", "hint": "每餐一掌心，比堆在晚餐好。"},
    {"id": "q6", "dim": "amount", "text": "我没有用利尿剂、泻药、催吐或极低热量代餐来减重。", "read": "10.1", "critical": true, "hint": "这些做法伤身，而且几乎一定反弹。"},
    {"id": "q7", "dim": "amount", "text": "我每餐的蔬菜大约占一半，深色蔬菜占一半。", "read": "3.1", "hint": "餐盘法比算克数容易坚持。"},
    {"id": "q8", "dim": "amount", "text": "我大概知道自己每天的维持能量区间，减脂时只减 300 到 500 千卡。", "read": "2.1", "hint": "不用精确到卡，用来判断是不是吃多了。"},
    {"id": "q9", "dim": "food", "text": "我的主食里至少一半是全谷物、杂豆或薯类。", "read": "5.1", "hint": "白米混糙米，先从三分之一开始。"},
    {"id": "q10", "dim": "food", "text": "我一天用油不超过 30 克，用盐不超过 5 克。", "read": "7.1", "hint": "限盐勺和刻度量油壶比意志力可靠。"},
    {"id": "q11", "dim": "food", "text": "我一周喝的含糖饮料不超过一次。", "read": "7.3", "hint": "液体热量最容易被忽略。"},
    {"id": "q12", "dim": "food", "text": "买包装食品时，我会看营养表能量、钠与配料表前三位。", "read": "2.6", "hint": "「零脂肪」常常加糖。"},
    {"id": "q13", "dim": "food", "text": "我一周吃的蔬菜超过五种，不是只吃一两种。", "read": "6.2", "hint": "颜色和种类轮换，营养谱才宽。"},
    {"id": "q14", "dim": "outside", "text": "外食时我会先夹菜和蛋白质，主食最后吃或减半。", "read": "8.3", "hint": "顺序比意志力管用。"},
    {"id": "q15", "dim": "outside", "text": "我知道自己常去的店该怎么点，不需要每次重新纠结。", "read": "8.2", "hint": "固定默认点法，减少决策成本。"},
    {"id": "q16", "dim": "outside", "text": "我一周至少四天能吃到自己控制的饭（自己做或有结构地吃）。", "read": "9.6", "hint": "不必追求百分之百。"},
    {"id": "q17", "dim": "outside", "text": "我喝酒有明确的次数上限，或者完全不喝。", "read": "8.5", "critical": true, "hint": "酒精没有安全的养生剂量。"},
    {"id": "q18", "dim": "risk", "text": "如果有确诊慢病或正在服药，我的饮食方案经过医生确认。", "read": "11.1", "hint": "书里的建议不能替代处方。"},
    {"id": "q19", "dim": "risk", "text": "我没有自行尝试生酮、长期断食或大剂量补剂。", "read": "12.3", "hint": "有基础病的人风险更高。"},
    {"id": "q20", "dim": "risk", "text": "我知道哪些症状必须就医，而不是靠调整饮食拖。", "read": "13.3", "hint": "不明原因体重下降、便血、持续腹痛，别等。"},
    {"id": "q21", "dim": "risk", "text": "我买的补剂都有明确原因，不是「吃了总没坏处」。", "read": "12.1", "hint": "脂溶性维生素过量也有风险。"},
    {"id": "q22", "dim": "habit", "text": "我能写出自己的五条饮食规则，并且记得住。", "read": "13.6", "hint": "留在生活里的是默认选项。"},
    {"id": "q23", "dim": "habit", "text": "一次吃多之后，我下一餐照常吃，不补偿性断食。", "read": "10.5", "hint": "全或无思维是失控的起点。"},
    {"id": "q24", "dim": "habit", "text": "我没有出现催吐、暴食、因进食而极度焦虑的情况。", "read": "12.5", "critical": true, "hint": "这些信号需要专业帮助，不是意志力问题。"}
  ]
}
;
const $ = (s) => document.querySelector(s);
const SCALE = QUIZ.scale;
let answers = {};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function init(){
  $("#intro").textContent = QUIZ.intro;
  const dims = QUIZ.dimensions;
  $("#quiz").innerHTML = dims.map(d => {
    const qs = QUIZ.questions.filter(q => q.dim === d.id);
    return `<section class="dim"><h2>${esc(d.name)} <span>${qs.length} 题</span></h2><p>${esc(d.desc)}</p>
      ${qs.map(q => `
        <div class="q ${q.critical ? "critical" : ""}" data-q="${q.id}">
          <div class="text"><span class="num">${q.id.slice(1)}</span><span>${esc(q.text)}</span></div>
          <div class="opts">
            ${[["yes","是"],["unsure","不确定"],["no","否"]].map(([v,l]) =>
              `<label><input type="radio" name="${q.id}" value="${v}">${l}</label>`).join("")}
          </div>
        </div>`).join("")}
    </section>`;
  }).join("");

  document.querySelectorAll("input[type=radio]").forEach(r => {
    r.addEventListener("change", () => {
      answers[r.name] = r.value;
      updateProgress();
      $("#result").classList.add("hidden");
    });
  });
  $("#progress").textContent = `0 / ${QUIZ.questions.length} 已答`;
  $("#submit").addEventListener("click", showResult);
  $("#reset").addEventListener("click", () => {
    answers = {}; document.querySelectorAll("input[type=radio]").forEach(r => r.checked = false);
    updateProgress(); $("#result").classList.add("hidden"); window.scrollTo({top:0,behavior:"smooth"});
  });
}

function updateProgress(){
  const n = Object.keys(answers).length;
  $("#progress").textContent = `${n} / ${QUIZ.questions.length} 已答`;
}

function showResult(){
  const unanswered = QUIZ.questions.filter(q => !answers[q.id]);
  if (unanswered.length){
    if (!confirm(`还有 ${unanswered.length} 题没答。未答按“不确定”计算，继续吗？`)) return;
  }
  const val = (q) => SCALE[answers[q.id] || "unsure"];
  const dims = QUIZ.dimensions.map(d => {
    const qs = QUIZ.questions.filter(q => q.dim === d.id);
    const got = qs.reduce((s,x) => s + val(x), 0);
    const max = qs.length * SCALE.yes;
    return {...d, got, max, pct: Math.round(got / max * 100), qs};
  });
  const totalGot = dims.reduce((s,d)=>s+d.got,0);
  const totalMax = dims.reduce((s,d)=>s+d.max,0);
  const pct = Math.round(totalGot / totalMax * 100);

  const critical = QUIZ.questions.filter(q => q.critical && answers[q.id] === "no");
  const weak = dims.slice().sort((a,b) => a.pct - b.pct);
  const todo = [];
  weak.forEach(d => {
    d.qs.filter(q => answers[q.id] !== "yes").forEach(q => {
      if (!todo.find(t => t.read === q.read)) todo.push(q);
    });
  });

  const band = pct >= 80 ? "稳" : pct >= 60 ? "有底子，也有漏点" : pct >= 40 ? "需要补结构" : "先停下签字，优先把条款弄清";
  const bandColor = pct >= 80 ? "var(--good)" : pct >= 60 ? "var(--warn)" : "var(--bad)";

  $("#result").className = "result";
  $("#result").innerHTML = `
    ${critical.length ? `<div class="recs red"><h3>先处理风险，不是先优化话术</h3>
      <p>你在 ${critical.length} 道红线题上选了“否”。这比任何食谱都优先：</p>
      <ul>${critical.map(q => `<li>${esc(q.text)}<div class="read">先读 <a href="index.html#${q.read}">${q.read}</a>：${esc(q.hint)}</div></li>`).join("")}</ul>
      <p>如果可以，告诉一个可信任的人，联系 110、12338 或 12356。不要独自对峙。</p></div>` : ""}

    <h2 style="margin:20px 0 4px">你的结果</h2>
    <div class="score">
      <div class="card"><div class="big" style="color:${bandColor}">${pct}%</div><div class="lbl">总分 · ${esc(band)}</div><div class="bar"><i style="width:${pct}%;background:${bandColor}"></i></div></div>
      ${weak.slice(0,2).map(d => `<div class="card"><div class="big">${d.pct}%</div><div class="lbl">${d.pct === 100 ? "满分项" : "最弱项"} · ${esc(d.name)}</div><div class="bar"><i style="width:${d.pct}%"></i></div></div>`).join("")}
    </div>

    <h3 style="font-size:16px;margin:22px 0 8px">六个维度</h3>
    ${dims.map(d => `<div class="dimrow"><span>${esc(d.name)}</span><span class="track"><i style="width:${d.pct}%"></i></span><span class="val">${d.pct}%</span></div>`).join("")}

    <div class="recs">
      <h3>先读这几条</h3>
      ${todo.length ? `<ul>${todo.slice(0,6).map(q => `<li>${esc(q.text)}<div class="read">读 <a href="index.html#${q.read}">${q.read}</a>：${esc(q.hint)}</div></li>`).join("")}</ul>`
        : `<p>你在所有题上都选了“是”。这不代表身体没问题，只代表你的日常结构比较稳。建议做一次体检，或读第 13.4 条挂号前该准备什么。</p>`}
    </div>

    <div class="recs">
      <h3>接下来 7 天，只做三件事</h3>
      <ol>
        <li>把最弱那一维的第一个“否”改成一个具体动作，写在日历上。</li>
        <li>找一个你信任的人，说一遍你的答案里最让你意外的那一题。</li>
        <li>如果红线题有“否”，先去看医生或停掉危险做法，再谈食谱。</li>
      </ol>
      <p class="read">这不是治疗计划。持续的痛苦、暴力、成瘾或自伤，请找专业帮助。</p>
    </div>

    <div class="actions" style="position:static;background:none;border:0;padding:0">
      <button type="button" id="copy-result">复制结果</button>
      <a href="index.html" style="font-size:13.5px;padding:9px 4px">去检索条目 →</a>
    </div>
  `;
  $("#copy-result").addEventListener("click", () => {
    const text = `健康饮食自查 ${pct}%\n` + dims.map(d => `${d.name}: ${d.pct}%`).join("\n") +
      `\n优先读：${todo.slice(0,6).map(q => q.read).join("、") || "无"}`;
    navigator.clipboard?.writeText(text).then(() => alert("已复制")).catch(() => alert(text));
  });
  $("#result").scrollIntoView?.({behavior:"smooth", block:"start"});
}
init();
</script>
</body>
</html>
