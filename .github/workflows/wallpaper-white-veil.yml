name: White-veil public wallpaper sources
on:
  push:
    branches: ['arena/77ee0396-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_white_veil.py'
      - '.github/workflows/wallpaper-white-veil.yml'
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            tools/wallpaper-job
            deliveries/white-veil
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Download and verify the nine publicly visible slides
        run: |
          mkdir -p deliveries/white-veil/01-下载原图
          set +e
          python tools/wallpaper-job/download_white_veil.py > deliveries/white-veil/01-下载原图/retrieval-log.txt 2>&1
          result=$?
          cat deliveries/white-veil/01-下载原图/retrieval-log.txt
          printf '%s\n' "$result" > deliveries/white-veil/01-下载原图/exit-code.txt
          exit "$result"
      - name: Return verified responses and diagnostics on this branch
        if: always()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          if [ "$(git branch --show-current)" != "$JOB_BRANCH" ]; then
            echo 'Not on the triggering branch; refusing to push' >&2
            exit 1
          fi
          git add -- deliveries/white-veil/01-下载原图
          if git diff --cached --quiet; then
            echo 'No new results'
            exit 0
          fi
          git commit -m 'Record white-veil public source retrieval'
          for attempt in 1 2 3; do
            git fetch origin "$JOB_BRANCH"
            git rebase "origin/$JOB_BRANCH" || exit 1
            if git push origin "$JOB_BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Could not return results to the triggering branch' >&2
          exit 1
