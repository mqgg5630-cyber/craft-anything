name: Download original wallpapers

# Manual trigger only. We do NOT run on `push` to avoid an infinite
# commit -> push -> run -> commit loop.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download even if original/ already has images"
        required: false
        default: "false"

permissions:
  contents: write   # needed to commit the downloaded images back to the branch

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this branch)
        uses: actions/checkout@v4
        with:
          ref: arena/09e7b6a9-craft-anything
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow (for image verification)
        run: python -m pip install --quiet Pillow

      - name: Download & verify original images
        run: python scripts/download_originals.py

      - name: Commit & push back to the same branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add original/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: download & verify original wallpapers via Actions"
            git push origin HEAD:arena/09e7b6a9-craft-anything
          fi
