name: Lululu sunset wallpaper source download
on:
  push:
    branches: ['arena/442f0ebc-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_lululu.py'
      - '.github/workflows/lululu-download.yml'
permissions:
  contents: write
concurrency:
  group: lululu-sunset-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/wallpaper-job/download_lululu.py
      - name: Return verified source files on the triggering branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lululu-sunset/01-下载原片
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified public Lululu sunset wallpaper source downloads'
            git push origin "HEAD:$JOB_BRANCH"
          fi
