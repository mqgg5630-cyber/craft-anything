name: Sunset b7 verified public source download
on:
  push:
    branches: ['arena/b7bfcf81-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_sunset_b7.py'
      - 'tools/wallpaper-job/test_sunset_b7.py'
      - 'deliveries/lululu-sunset-b7/source-seed.json'
      - '.github/workflows/sunset-b7-download.yml'
permissions:
  contents: write
concurrency:
  group: sunset-b7-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools/wallpaper-job -p 'test_sunset_b7.py' -v
      - run: python tools/wallpaper-job/download_sunset_b7.py
      - name: Return safe failure diagnostic (no images)
        if: failure()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          if test -f deliveries/lululu-sunset-b7/download-status.json; then
            git config user.name 'wallpaper-delivery[bot]'
            git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
            git add deliveries/lululu-sunset-b7/download-status.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record public source download blocker without unverified images'
              git push origin "HEAD:$JOB_BRANCH"
            fi
          fi
      - name: Return only verified sources to the same branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/b7bfcf81-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lululu-sunset-b7/source deliveries/lululu-sunset-b7/source-manifest.json deliveries/lululu-sunset-b7/download-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Return verified sunset reference images from GitHub Actions'
            git push origin "HEAD:$JOB_BRANCH"
          fi
