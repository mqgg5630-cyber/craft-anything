name: Rainy note source download
on:
  push:
    branches: ['arena/77ee0396-craft-anything']
    paths: ['tools/wallpaper-job/download_rainy.py', '.github/workflows/wallpaper-rainy.yml']
permissions:
  contents: read
concurrency:
  group: wallpaper-rainy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Download nine public slides
        run: python tools/wallpaper-job/download_rainy.py
      - name: Upload verified sources as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rainy-note-sources
          path: deliveries/rainy-note/01-下载原图
          if-no-files-found: error
