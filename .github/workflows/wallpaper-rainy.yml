name: Rainy note source download
on:
  push:
    branches: ['arena/77ee0396-craft-anything']
    paths: ['tools/wallpaper-job/download_rainy.py', '.github/workflows/wallpaper-rainy.yml']
permissions:
  contents: write
concurrency:
  group: wallpaper-rainy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Download nine public slides
        run: python tools/wallpaper-job/download_rainy.py
      - name: Commit verified sources on the triggering branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/rainy-note/01-下载原图
          if git diff --cached --quiet; then
            echo 'Nothing new to commit'
            exit 0
          fi
          git commit -m 'Add verified rainy-note wallpaper source downloads'
          # The branch can move while this job runs; rebase onto the latest tip.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$JOB_BRANCH"
            git rebase "origin/$JOB_BRANCH" || git rebase --abort
            if git push origin "HEAD:$JOB_BRANCH"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo 'Could not push sources' >&2
          exit 1
