name: Wallpaper source download
on:
  push:
    branches: ['arena/e134e8d7-craft-anything']
    paths: ['tools/wallpaper-job/download_doraemon.py', '.github/workflows/wallpaper-download.yml']
permissions:
  contents: write
concurrency:
  group: wallpaper-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/wallpaper-job/download_doraemon.py
      - name: Return verified source files on the triggering branch
        if: always()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/doraemon-dream-world/01-下载原图
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified public wallpaper source downloads'
            git push origin "HEAD:$JOB_BRANCH"
          fi
