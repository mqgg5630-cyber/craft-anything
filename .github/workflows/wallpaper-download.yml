name: Wallpaper source download
on:
  push:
    branches: ['arena/77ee0396-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_sticker3d.py'
      - 'tools/wallpaper-job/download_garden_cats.py'
      - 'tools/wallpaper-job/download_cloudtown.py'
      - 'tools/wallpaper-job/download_roadhome.py'
      - '.github/workflows/wallpaper-download.yml'
permissions:
  contents: write
concurrency:
  group: wallpaper-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Download butterfly-hill cat house sources
        run: python tools/wallpaper-job/download_garden_cats.py
      - name: Download cloud-town (2N522Qk8Gxn) four public slides
        continue-on-error: true
        run: python tools/wallpaper-job/download_cloudtown.py
      - name: Download road-home (9fm9nrxkJxi) eleven public slides
        run: python tools/wallpaper-job/download_roadhome.py
      - name: Re-verify earlier 3D sticker sources (non-blocking)
        continue-on-error: true
        run: python tools/wallpaper-job/download_sticker3d.py
      - name: Return verified source files on the triggering branch
        if: always()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/sticker3d-animals/01-下载原图 \
                  deliveries/garden-cats/01-下载原图 \
                  deliveries/cloud-town-2n522qk8gxn/01-下载原图 \
                  deliveries/road-home-9fm9nrxkjxi/01-下载原图
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified wallpaper source downloads'
            git push origin "HEAD:$JOB_BRANCH"
          fi
