name: Pull cloud bundles onto disk
on:
  push:
    branches: ['arena/77ee0396-craft-anything']
    paths:
      - 'tools/wallpaper-job/cloud-manifest.json'
      - '.github/workflows/pull-cloud.yml'
permissions:
  contents: write
concurrency:
  group: pull-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialise cloud bundles
        env:
          CLOUD_MANIFEST_JSON: ''
        run: |
          CLOUD_MANIFEST_JSON="$(cat tools/wallpaper-job/cloud-manifest.json)" \
            python tools/wallpaper-job/pull_cloud.py
      - name: Commit on the triggering branch
        if: always()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add -- deliveries
          if git diff --cached --quiet; then
            echo 'Nothing new to commit'
            exit 0
          fi
          git commit -m 'chore(deliveries): materialise cloud bundles onto disk'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$JOB_BRANCH"
            git rebase "origin/$JOB_BRANCH" || git rebase --abort
            if git push origin "HEAD:$JOB_BRANCH"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo 'Could not push pulled bundles' >&2
          exit 1
