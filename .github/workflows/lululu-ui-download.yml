name: Lululu sunset (UI suite) source download
on:
  workflow_dispatch:
  push:
    branches: ['arena/2d4fad4b-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_lululu_ui.py'
      - '.github/workflows/lululu-ui-download.yml'
permissions:
  contents: write
concurrency:
  group: lululu-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/wallpaper-job/download_lululu_ui.py
      - name: Return verified source files on the triggering branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lululu-sunset-ui-10/原片 deliveries/lululu-sunset-ui-10/source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Download verified Lululu sunset public source images'
            git push origin "HEAD:$JOB_BRANCH"
          fi
