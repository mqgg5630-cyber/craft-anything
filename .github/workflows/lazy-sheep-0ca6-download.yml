name: Lazy sheep sunset public source download
on:
  push:
    branches: ['arena/0ca652e4-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_lazy_sheep_0ca6.py'
      - '.github/workflows/lazy-sheep-0ca6-download.yml'
      - 'deliveries/lazy-sheep-6bdoxc66Ezp/source-seed.json'
permissions:
  contents: write
concurrency:
  group: lazy-sheep-0ca6-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools/wallpaper-job -p 'test_lazy_sheep_0ca6.py' -v
      - run: PYTHONPATH=tools/wallpaper-job python tools/wallpaper-job/download_lazy_sheep_0ca6.py
      - name: Return safe diagnostic only on failure
        if: failure()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/0ca652e4-craft-anything'
          if test -f deliveries/lazy-sheep-6bdoxc66Ezp/download-status.json; then
            git config user.name 'wallpaper-delivery[bot]'
            git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
            git add deliveries/lazy-sheep-6bdoxc66Ezp/*.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record lazy sheep sunset public source blocker'
              git push origin "HEAD:$JOB_BRANCH"
            fi
          fi
      - name: Return verified source to same branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/0ca652e4-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lazy-sheep-6bdoxc66Ezp/source deliveries/lazy-sheep-6bdoxc66Ezp/source-manifest.json deliveries/lazy-sheep-6bdoxc66Ezp/download-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Return verified lazy sheep sunset source from Actions'
            git push origin "HEAD:$JOB_BRANCH"
          fi
