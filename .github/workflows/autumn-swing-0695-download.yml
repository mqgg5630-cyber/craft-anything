name: Autumn swing public carousel download (0695)
on:
  push:
    branches: ['arena/069516c5-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_autumn_swing_0695.py'
      - 'tools/wallpaper-job/test_autumn_swing_0695.py'
      - 'deliveries/autumn-swing-C5WkFiFa1r/source-seed.json'
      - '.github/workflows/autumn-swing-0695-download.yml'
permissions:
  contents: write
concurrency:
  group: autumn-swing-0695-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools/wallpaper-job -p 'test_autumn_swing_0695.py' -v
      - run: python tools/wallpaper-job/download_autumn_swing_0695.py
      - name: Return safe diagnostic only on failure
        if: failure()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/069516c5-craft-anything'
          if test -f deliveries/autumn-swing-C5WkFiFa1r/download-status.json; then
            git config user.name 'wallpaper-delivery[bot]'
            git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
            git add deliveries/autumn-swing-C5WkFiFa1r/download-status.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record autumn swing public source download blocker'
              git push origin "HEAD:$JOB_BRANCH"
            fi
          fi
      - name: Return verified source image and manifest to triggering branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/069516c5-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/autumn-swing-C5WkFiFa1r/source deliveries/autumn-swing-C5WkFiFa1r/source-manifest.json deliveries/autumn-swing-C5WkFiFa1r/download-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Return verified autumn swing source image from Actions'
            git push origin "HEAD:$JOB_BRANCH"
          fi
