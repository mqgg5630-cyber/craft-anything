name: Lumei note source download
on:
  workflow_dispatch:
  push:
    branches: ['arena/2d4fad4b-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_xhs_note.py'
      - '.github/workflows/lumei-note-download.yml'
permissions:
  contents: write
concurrency:
  group: lumei-note-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/wallpaper-job/download_xhs_note.py 'https://xhslink.cn/o/1zbYYyvDu9W' deliveries/lumei-source-1zbYY
      - name: Return verified source files on the triggering branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lumei-source-1zbYY
          if ! git diff --cached --quiet; then
            git commit -m 'Download verified public source images for note 1zbYYyvDu9W'
            git push origin "HEAD:$JOB_BRANCH"
          fi
