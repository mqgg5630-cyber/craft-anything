name: Add romantic captions to replicas

on:
  workflow_dispatch:
  push:
    branches: ['arena/09e7b6a9-craft-anything']
    paths:
      - 'tools/wallpaper-job/add_captions.py'
      - '.github/workflows/add-captions.yml'
permissions:
  contents: write
concurrency:
  group: captions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  caption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==11.3.0
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - run: python tools/wallpaper-job/add_captions.py
      - name: Commit captioned images to the triggering branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/little-prince-xhs-10/images-captioned
          if ! git diff --cached --quiet; then
            git commit -m 'Add short romantic captions to the 10 Little Prince replicas'
            git push origin "HEAD:$JOB_BRANCH"
          else
            echo "No captioned images to commit"
          fi
