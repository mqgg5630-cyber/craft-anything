name: Cute Lulu verified public source download
on:
  push:
    branches: ['arena/cf4bb177-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_cute_lulu.py'
      - 'tools/wallpaper-job/test_download_cute_lulu.py'
      - '.github/workflows/cute-lulu-download.yml'
permissions:
  contents: write
concurrency:
  group: cute-lulu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools/wallpaper-job -p test_download_cute_lulu.py -v
      - run: python tools/wallpaper-job/download_cute_lulu.py
        if: hashFiles('deliveries/lulu-cute-10/source-manifest.json') == ''
      - name: Return only the verified cute Lulu source set to this same branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/cf4bb177-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lulu-cute-10
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified cute Lulu public note source images and preview'
            git push origin "HEAD:$JOB_BRANCH"
          fi
