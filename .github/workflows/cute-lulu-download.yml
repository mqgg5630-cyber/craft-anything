name: Cute Lululu verified public source download
on:
  push:
    branches: ['arena/b7bfcf81-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_cute_lulu.py'
      - '.github/workflows/cute-lulu-download.yml'
permissions:
  contents: write
concurrency:
  group: cute-lulu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/wallpaper-job/download_cute_lulu.py
      - name: Return safe diagnostic only on failure
        if: failure()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/b7bfcf81-craft-anything'
          if test -f deliveries/lululu-cute-65mKtkE8Uk/download-status.json; then
            git config user.name 'wallpaper-delivery[bot]'
            git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
            git add deliveries/lululu-cute-65mKtkE8Uk/download-status.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record new cute Lululu public source blocker'
              git push origin "HEAD:$JOB_BRANCH"
            fi
          fi
      - name: Return fully verified carousel to same branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/b7bfcf81-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lululu-cute-65mKtkE8Uk/source deliveries/lululu-cute-65mKtkE8Uk/source-manifest.json deliveries/lululu-cute-65mKtkE8Uk/download-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Return verified cute Lululu source carousel from Actions'
            git push origin "HEAD:$JOB_BRANCH"
          fi
