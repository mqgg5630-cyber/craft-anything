name: Autumn swing public carousel download
on:
  push:
    branches: ['arena/b7bfcf81-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_autumn_swing_b7.py'
      - '.github/workflows/autumn-swing-b7-download.yml'
permissions:
  contents: write
concurrency:
  group: autumn-swing-b7-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/wallpaper-job/download_autumn_swing_b7.py
      - name: Return safe diagnostic only on failure
        if: failure()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/b7bfcf81-craft-anything'
          if test -f deliveries/autumn-swing-C5WkFiFa1r/download-status.json; then
            git config user.name 'wallpaper-delivery[bot]'
            git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
            git add deliveries/autumn-swing-C5WkFiFa1r/*.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record new autumn swing public source blocker'
              git push origin "HEAD:$JOB_BRANCH"
            fi
          fi
      - name: Return fully verified carousel to same branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/b7bfcf81-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/autumn-swing-C5WkFiFa1r/source deliveries/autumn-swing-C5WkFiFa1r/source-manifest.json deliveries/autumn-swing-C5WkFiFa1r/download-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Return verified autumn swing source carousel from Actions'
            git push origin "HEAD:$JOB_BRANCH"
          fi
