name: Lazy sheep character research download
on:
  push:
    branches: ['arena/28bd3553-craft-anything']
    paths: ['tools/wallpaper-job/download_lazy_research.py', 'deliveries/lazy-sheep-ten-scenes/research-seed.json', '.github/workflows/lazy-sheep-ten-scenes-download.yml']
permissions:
  contents: write
concurrency:
  group: lazy-sheep-ten-scenes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/wallpaper-job/download_lazy_research.py
      - name: Return validated files or diagnostic to this branch
        if: always()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lazy-sheep-ten-scenes
          if ! git diff --cached --quiet; then
            git commit -m 'Record character research download result'
            git push origin "HEAD:$JOB_BRANCH"
          fi
