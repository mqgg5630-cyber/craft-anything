name: Koi dream public carousel download
on:
  push:
    branches: ['arena/b7bfcf81-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_koi_dream.py'
      - 'tools/wallpaper-job/test_koi_dream.py'
      - '.github/workflows/koi-dream-download.yml'
permissions:
  contents: write
concurrency:
  group: koi-dream-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools/wallpaper-job -p 'test_koi_dream.py' -v
      - run: python tools/wallpaper-job/download_koi_dream.py
      - name: Return safe diagnostic only on failure
        if: failure()
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/b7bfcf81-craft-anything'
          if test -f deliveries/koi-dream-3qz2uQpojFp/download-status.json; then
            git config user.name 'wallpaper-delivery[bot]'
            git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
            git add deliveries/koi-dream-3qz2uQpojFp/*.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record new koi dream public source blocker'
              git push origin "HEAD:$JOB_BRANCH"
            fi
          fi
      - name: Return fully verified carousel to same branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/b7bfcf81-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/koi-dream-3qz2uQpojFp/source deliveries/koi-dream-3qz2uQpojFp/source-manifest.json deliveries/koi-dream-3qz2uQpojFp/download-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Return verified koi dream source carousel from Actions'
            git push origin "HEAD:$JOB_BRANCH"
          fi
