name: Koi Dream verified public source download
on:
  push:
    branches: ['arena/cf4bb177-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_koi_dream.py'
      - 'tools/wallpaper-job/test_download_koi_dream.py'
      - '.github/workflows/koi-dream-download.yml'
permissions:
  contents: write
concurrency:
  group: koi-dream-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/wallpaper-job
            .github/workflows
            deliveries/koi-dream-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools/wallpaper-job -p test_download_koi_dream.py -v
      - run: python tools/wallpaper-job/download_koi_dream.py
        if: hashFiles('deliveries/koi-dream-10/source-manifest.json') == ''
      - name: Return only the complete verified source set to this same branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/cf4bb177-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/koi-dream-10
          if ! git diff --cached --quiet; then
            git commit -m 'Add validated Koi Dream public source images and source preview'
            git push origin "HEAD:$JOB_BRANCH"
          fi
