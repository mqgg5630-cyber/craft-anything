name: Sunset wallpaper verified download
on:
  push:
    branches: ['arena/cf4bb177-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_sunset.py'
      - 'tools/wallpaper-job/test_download_sunset.py'
      - '.github/workflows/sunset-download.yml'
permissions:
  contents: write
concurrency:
  group: sunset-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools/wallpaper-job -p test_download_sunset.py -v
      - run: python tools/wallpaper-job/download_sunset.py
        if: hashFiles('deliveries/lulumei-sunset-10/source-manifest.json') == ''
      - name: Commit only the fully verified source set to this same branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/cf4bb177-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lulumei-sunset-10
          if ! git diff --cached --quiet; then
            git commit -m 'Add validated sunset public note source images and preview'
            git push origin "HEAD:$JOB_BRANCH"
          fi
