name: New Year blessings verified download
on:
  push:
    branches: ['arena/cf4bb177-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_new_year_blessings.py'
      - 'tools/wallpaper-job/test_download_new_year_blessings.py'
      - '.github/workflows/new-year-blessings-download.yml'
permissions:
  contents: write
concurrency:
  group: new-year-blessings-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/wallpaper-job
            .github/workflows
            deliveries/new-year-blessings-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools/wallpaper-job -p test_download_new_year_blessings.py -v
      - run: python tools/wallpaper-job/download_new_year_blessings.py
        if: hashFiles('deliveries/new-year-blessings-10/source-manifest.json') == ''
      - name: Return only the verified note images to this same branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          test "$JOB_BRANCH" = 'arena/cf4bb177-craft-anything'
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/new-year-blessings-10
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified New Year blessing wallpaper references and dimensions'
            git push origin "HEAD:$JOB_BRANCH"
          fi
