name: Sunset wallpaper source download
on:
  push:
    branches: ['arena/28bd3553-craft-anything']
    paths:
      - 'tools/wallpaper-job/download_sunset.py'
      - '.github/workflows/sunset-new-download.yml'
      - 'deliveries/lululu-sunset-new/source-seed.json'
permissions:
  contents: write
concurrency:
  group: sunset-new-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/wallpaper-job/download_sunset.py
      - name: Commit validated source files on this branch
        env:
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'wallpaper-delivery[bot]'
          git config user.email 'wallpaper-delivery[bot]@users.noreply.github.com'
          git add deliveries/lululu-sunset-new/source deliveries/lululu-sunset-new/source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add validated sunset wallpaper references'
            git push origin "HEAD:$JOB_BRANCH"
          fi
