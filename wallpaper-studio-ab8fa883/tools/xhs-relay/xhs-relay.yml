name: xhs-relay-ab8fa883

# Isolated relay for wallpaper-studio-ab8fa883 only. Downloads XHS/Rednote originals on
# the runner and commits them back to the triggering branch; sandbox egress cannot
# reach the CDN or artifact blob storage.
on:
  push:
    paths:
      - 'wallpaper-studio-ab8fa883/tools/xhs-relay/queue.json'
      - 'wallpaper-studio-ab8fa883/tools/xhs-relay/xhs_fetch.py'
      - '.github/workflows/xhs-relay-ab8fa883.yml'
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      only_note:
        description: 'Only run jobs whose note_url contains this note id (optional)'
        required: false
        default: ''
      force:
        description: 'Ignore existing note.json and refetch'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: xhs-relay-ab8fa883-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install --quiet --upgrade requests pillow

      - name: Fetch notes in queue
        env:
          COOKIES_XHS: ${{ secrets.COOKIES_XHS }}
          ONLY_NOTE: ${{ inputs.only_note }}
          FORCE: ${{ inputs.force }}
        run: |
          python wallpaper-studio-ab8fa883/tools/xhs-relay/xhs_fetch.py \
            --queue wallpaper-studio-ab8fa883/tools/xhs-relay/queue.json 2>&1 | tee /tmp/xhs-relay-ab8fa883.log

      - name: Commit results back to this branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.quotePath false
          git add wallpaper-studio-ab8fa883
          if git diff --cached --quiet; then
            echo "nothing new to commit"; exit 0
          fi
          n=$(git diff --cached --name-only | grep -cE '\.(png|jpe?g|webp|heic|avif|gif)$' || true)
          git commit -m "wallpaper-relay: fetched ${n} image(s) ($(date -u +%Y-%m-%dT%H%M%SZ))"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1
